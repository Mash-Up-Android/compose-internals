name: Update README with Notion Link

on:
  issues:
    types: [opened]

jobs:
  update-readme:
    if: contains(github.event.issue.labels.*.name, 'notion-link')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse issue and update README
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/links.json README.md
          git diff --staged --quiet || git commit -m "docs: ${{ env.MEMBER }} ${{ env.WEEK }}주차 노션 링크 등록 (#${{ github.event.issue.number }})"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ README에 링크가 등록되었습니다!'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
