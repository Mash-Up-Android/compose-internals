name: Delete Notion Link from README

on:
  issues:
    types: [opened]

jobs:
  delete-link:
    if: contains(github.event.issue.labels.*.name, 'delete-notion-link')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse issue and delete link
        id: delete
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/delete_link.py

      - name: Commit changes
        if: steps.delete.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/links.json README.md
          git diff --staged --quiet || git commit -m "docs: ${{ env.MEMBER }} ${{ env.WEEK }}주차 노션 링크 삭제 (#${{ github.event.issue.number }})"
          git push

      - name: Comment and close on success
        if: steps.delete.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🗑️ 링크가 삭제되었습니다. 올바른 링크를 다시 등록하려면 [노션 링크 등록 이슈](../../issues/new/choose)를 열어주세요.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment and close on failure
        if: steps.delete.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const errorMessage = '${{ steps.delete.outputs.error_message }}' || '알 수 없는 오류가 발생했습니다.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ 삭제에 실패했습니다.\n\n> ${errorMessage}\n\n이슈 내용을 확인 후 다시 시도해주세요.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
